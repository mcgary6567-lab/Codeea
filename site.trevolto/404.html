<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Trevolto</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0}
    body{font-family:Inter,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0a0d13;color:#e8edf5;
      min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
      background:radial-gradient(900px 500px at 80% -10%,rgba(0,194,181,.10),#0a0d13 60%)}
    .wrap{max-width:520px}
    .logo{height:34px;margin-bottom:26px}
    .code{font-size:96px;font-weight:900;line-height:1;background:linear-gradient(135deg,#00c2b5,#7c5cfc);
      -webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:26px;font-weight:800;margin:14px 0 8px}
    p{color:#8fa0b5;font-size:16px;line-height:1.6;margin-bottom:28px}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a.btn{display:inline-block;padding:13px 26px;border-radius:8px;font-weight:800;text-decoration:none;font-size:15px}
    .primary{background:linear-gradient(135deg,#00a49c,#00c2b5);color:#04211f}
    .ghost{border:1px solid #242d3e;color:#e8edf5}
    a.btn:hover{filter:brightness(1.08)}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/assets/img-01.png" alt="Trevolto" />
    <div class="code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back on track.</p>
    <div class="btns">
      <a class="btn primary" href="/">← Back to home</a>
      <a class="btn ghost" href="/checkout">Get Instant Access</a>
    </div>
  </div>
</body>
</html>
