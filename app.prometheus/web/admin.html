<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prometheus Web — Admin</title>
<link rel="stylesheet" href="/static/style.css"/>
<link rel="icon" href="https://prometheusbot.com/hosted/images/0f/af4d7125b6470b9ed2cd957982852a/51.png"/>
</head>
<body>
<div id="toasts" class="toasts"></div>
<div id="app" style="max-width:1150px">
  <div class="status">
    <span class="brand" style="font-size:18px;font-weight:800"><img src="https://prometheusbot.com/hosted/images/0f/af4d7125b6470b9ed2cd957982852a/51.png" class="logo-img" alt="Prometheus"/> Prometheus</span>
    <span class="badge">Admin · customer panel</span>
    <span class="sp"></span>
    <span class="k" id="ad-me">—</span>
    <a class="btn ghost sm" href="/">← Dashboard</a>
    <button class="btn ghost sm" onclick="logout()">Logout</button>
  </div>

  <div id="gate" class="card hidden">
    <h3>Admin sign-in</h3>
    <label>Email</label><input id="g-email" type="email"/>
    <label>Password</label><input id="g-pass" type="password"/>
    <div class="err" id="g-err"></div>
    <button class="btn" style="margin-top:10px" onclick="adminLogin()">Sign in</button>
  </div>

  <div id="panel" class="hidden">
    <div class="row" style="margin-bottom:14px">
      <div class="card col"><div class="k">Customers</div><div class="big" id="m-total">—</div></div>
      <div class="card col"><div class="k">Active trials</div><div class="big" id="m-trial">—</div></div>
      <div class="card col"><div class="k">Licensed</div><div class="big" id="m-lic">—</div></div>
      <div class="card col"><div class="k">Suspended / expired</div><div class="big" id="m-off">—</div></div>
    </div>
    <div class="card">
      <h3>Customers <button class="btn ghost sm" style="float:right" onclick="loadUsers()">Refresh</button></h3>
      <table><thead><tr>
        <th>ID</th><th>Email</th><th>Status</th><th>Plan</th><th>Days left</th>
        <th>Keys</th><th>Last seen</th><th>Actions</th></tr></thead>
        <tbody id="u-body"></tbody></table>
    </div>
  </div>
</div>
<footer class="site-footer">
  <div class="foot-inner">
    <div class="foot-brand"><img src="https://prometheusbot.com/hosted/images/0f/af4d7125b6470b9ed2cd957982852a/51.png" class="logo-img" alt="Prometheus"/> <b>Prometheus</b></div>
    <div class="foot-links">
      <a href="https://www.prometheusai.tech/support" target="_blank" rel="noopener">Contact us</a>
    </div>
    <div class="foot-copy">© 2026 Prometheus. All rights reserved.</div>
  </div>
</footer>
<script src="/static/admin.js"></script>
</body>
</html>
