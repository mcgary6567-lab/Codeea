# Online Quran College - docker compose stack.
#
#   docker compose up -d --build                 laptop: PostgreSQL + app on http://127.0.0.1:8000
#   COMPOSE_PROFILES=server docker compose up -d server: + Caddy (HTTPS) + nightly pg_dump
#
# Everything is configured through .env (see install.sh, which writes one with generated secrets).
# Variables used here: POSTGRES_PASSWORD (required), SITE_ADDRESS, BACKUP_KEEP_DAYS, WEB_CONCURRENCY,
# GIT_COMMIT, COMPOSE_PROFILES. The app reads the rest of .env itself (env_file).
#
# Workers and the scheduler: the app runs an in-process APScheduler, one per uvicorn worker, so more
# than one worker runs every job twice. Keep WEB_CONCURRENCY=1 (the default). To scale the web tier,
# set SCHEDULER_ENABLED=false and WEB_CONCURRENCY=4 in .env and start the "jobs" profile, which runs a
# single extra container with the scheduler on:  COMPOSE_PROFILES=server,scale docker compose up -d
name: oqc

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oqc
      POSTGRES_USER: oqc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oqc -d oqc"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    image: oqc:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oqc:${POSTGRES_PASSWORD}@db:5432/oqc
      PORT: "8000"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/app/storage          # uploads, PDFs, agent screenshots, app-side backup zips
    ports:
      - "127.0.0.1:8000:8000"         # local access / nginx on the host; Caddy uses the network

  # Optional: a dedicated scheduler container, only when the web containers run SCHEDULER_ENABLED=false.
  jobs:
    image: oqc:latest
    profiles: ["scale"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://oqc:${POSTGRES_PASSWORD}@db:5432/oqc
      SKIP_BOOTSTRAP: "true"          # the app container already migrated and seeded
      SCHEDULER_ENABLED: "true"
      WEB_CONCURRENCY: "1"
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - storage:/app/storage

  caddy:
    image: caddy:2-alpine
    profiles: ["server"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}   # "os.example.com" -> automatic Let's Encrypt; ":80" -> plain HTTP
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  backup:
    image: postgres:16-alpine          # pg_dump must be >= the server version; the app image has none
    profiles: ["server"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  storage:
  backups:
  caddy_data:
  caddy_config:
