{% extends "base.html" %}
{% block title %}{{ code }} · {{ title }}{% endblock %}
{% set body %}
<div class="flex min-h-[60vh] flex-col items-center justify-center text-center">
  <div class="text-7xl font-black tracking-tight text-brand-600/20">{{ code }}</div>
  <h1 class="mt-2 text-2xl font-bold text-slate-900 dark:text-white">{{ title }}</h1>
  <p class="mt-2 max-w-md text-sm text-slate-500">{{ message }}</p>
  <div class="mt-6 flex gap-2">
    <a href="javascript:history.back()" class="rounded-lg border border-slate-300 px-4 py-2 text-sm dark:border-slate-700">Go back</a>
    <a href="{{ home_url }}" class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-medium text-white">Home</a>
  </div>
</div>
{% endset %}
{% block content %}{{ body }}{% endblock %}
{% block public %}<div class="min-h-screen bg-slate-50 dark:bg-slate-950 p-6">{{ body }}</div>{% endblock %}
