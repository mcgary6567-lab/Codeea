{% extends "base.html" %}
{% import "macros.html" as ui %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="mx-auto max-w-7xl">
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5">
    {% for s in sections %}
      {{ ui.module_card(s.label, '/home/' ~ s.slug, icon=s.icon, color=s.color, subtitle=s.blurb, tall=True) }}
    {% endfor %}
  </div>
</div>
{% endblock %}
