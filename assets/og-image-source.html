<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0A0E1A}

</style>
</head>
<body>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif">

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- ===== LEFT: branding + offer ===== -->

    </g>

    <text x="0" y="120" fill="#FFFFFF" font-size="58" font-weight="800" letter-spacing="-1.5">Automated Gold</text>

    <text x="0" y="236" fill="#C7CCD6" font-size="25" font-weight="600">MetaTrader 5 · XAUUSD · Hands-free</text>

    <g transform="translate(0,272)">

      <text x="116" y="38" fill="#0A0E1A" font-size="25" font-weight="800" text-anchor="middle">$220 one-time</text>
      
    </g>

    <g transform="translate(0,366)" font-size="17" font-weight="600">
      <g fill="#34D399"><circle cx="9" cy="-5" r="9" fill="rgba(16,185,129,0.15)"/><path d="M5 -5 l3 3 l5 -6" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text x="26" y="0" fill="#9aa6b5">60-day money-back guarantee · No subscription</text>
    </g>
  </g>

  <!-- ===== RIGHT: chart terminal card ===== -->

    <circle cx="520" cy="20" r="4" fill="#34D399"/><text x="535" y="25" fill="#34D399" font-size="12" font-weight="700">LIVE</text>

    <!-- chart inner -->
    <g transform="translate(0,40)">
      <text x="290" y="44" fill="#C9A227" font-size="16" font-weight="800" text-anchor="middle">EMA 9 / 21 GOLDEN CROSS</text>

        <line x1="150" y1="60" x2="150" y2="420"/><line x1="290" y1="60" x2="290" y2="420"/><line x1="430" y1="60" x2="430" y2="420"/>

      <line x1="240" y1="330" x2="560" y2="330" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="6 5"/><rect x="452" y="318" width="104" height="24" rx="5" fill="#0b1018" stroke="#5a2327"/><text x="504" y="335" fill="#F87171" font-size="13" font-weight="700" text-anchor="middle" font-family="Consolas,monospace">SL 4008.40</text>
      <!-- EMA lines -->
      <polyline points="32,360 90,340 150,318 210,288 240,248 300,210 360,182 420,160 490,140 556,124" fill="none" stroke="#dfe3ea" stroke-width="2.4"/>
      <polyline points="32,380 90,362 150,344 210,316 240,278 300,238 360,206 420,180 490,156 556,138" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <polyline points="32,398 90,388 150,372 210,352 240,322 300,288 360,256 420,226 490,198 556,176" fill="none" stroke="#3B82F6" stroke-width="2.6"/>
      <!-- candles -->
      <g>
        <line x1="70" y1="330" x2="70" y2="368" stroke="#2faa86"/><rect x="63" y="336" width="14" height="24" fill="#0b1018" stroke="#2faa86" stroke-width="1.4"/>
        <line x1="130" y1="316" x2="130" y2="356" stroke="#e06363"/><rect x="123" y="322" width="14" height="26" fill="#e06363"/>

        <line x1="490" y1="124" x2="490" y2="164" stroke="#2faa86"/><rect x="483" y="130" width="14" height="24" fill="#0b1018" stroke="#2faa86" stroke-width="1.4"/>

      <polygon points="240,300 230,318 250,318" fill="#10B981"/>
      <rect x="214" y="322" width="52" height="24" rx="6" fill="rgba(16,185,129,0.15)"/>
      <text x="240" y="339" fill="#34D399" font-size="15" font-weight="800" text-anchor="middle">BUY</text>
    </g>
  </g>
</svg>
</body>
</html>
