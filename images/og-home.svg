  <text x="920" y="515" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#FB923C">1,000+</text>
  <text x="920" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8">Happy Clients</text>

