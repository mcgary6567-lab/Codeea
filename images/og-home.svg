  <text x="220" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8">Avg Opt-In Rate</text>

  <rect x="410" y="480" width="320" height="90" rx="16" fill="#1E293B"/>
  <text x="570" y="515" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800" fill="#EC4899">90%</text>
  <text x="570" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#94A3B8">Tier-1 Traffic</text>

