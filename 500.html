<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F59E0B">
<title>Something Went Wrong (500) — Gold Scalpers EA</title>
<meta name="robots" content="noindex, follow">
<style>
:root{--bg:#FFFFFF;--border:#E5E7EB;--gold:#D97706;--gold-bright:#F59E0B;--text:#111827;--text-muted:#6B7280;--text-dim:#9CA3AF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--gold);text-decoration:none}
.nav{border-bottom:1px solid var(--border);padding:0.9rem 0}
.nav-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;padding:0 1.5rem}
.logo{display:flex;align-items:center;gap:0.6rem;font-weight:800;font-size:1.1rem;color:var(--text)}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:3rem 1.5rem}
.box{max-width:560px}
.code{font-size:5.5rem;font-weight:800;letter-spacing:-0.04em;line-height:1;background:linear-gradient(135deg,var(--gold),var(--gold-bright));-webkit-background-clip:text;background-clip:text;color:transparent}
.box h1{font-size:1.7rem;font-weight:800;margin:0.6rem 0;letter-spacing:-0.02em}
.box p{color:var(--text-muted);font-size:1rem;margin-bottom:1.8rem}
.btns{display:flex;gap:0.7rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.75rem 1.4rem;border-radius:10px;font-weight:700;font-size:0.95rem;transition:all 0.2s}
.btn-primary{background:var(--gold);color:#fff;box-shadow:0 2px 8px rgba(217,119,6,0.25)}
.btn-primary:hover{background:#B45309;transform:translateY(-1px);color:#fff}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.icon{width:64px;height:64px;margin:0 auto 0.5rem;color:var(--gold);opacity:0.9}
.sec-ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-0.16em;margin-right:.5rem;stroke:#F59E0B;color:#F59E0B;flex-shrink:0}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="logo">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="#F59E0B" stroke-width="1.5" opacity="0.3"/><circle cx="16" cy="16" r="9" stroke="#F59E0B" stroke-width="1.5"/><circle cx="16" cy="16" r="2" fill="#F59E0B"/><line x1="16" y1="2" x2="16" y2="9" stroke="#F59E0B" stroke-width="1.5"/><line x1="16" y1="23" x2="16" y2="30" stroke="#F59E0B" stroke-width="1.5"/><line x1="2" y1="16" x2="9" y2="16" stroke="#F59E0B" stroke-width="1.5"/><line x1="23" y1="16" x2="30" y2="16" stroke="#F59E0B" stroke-width="1.5"/></svg>
      Gold Scalpers
    </a>
  </div>
</nav>

<main class="wrap">
  <div class="box">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <div class="code">500</div>
    <h1><svg class="sec-ico" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.05em;height:1.05em;min-width:1.05em;vertical-align:-0.14em;margin-right:0.4rem;display:inline-block;flex:0 0 auto"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Something went wrong on our end.</h1>
    <p>We hit a temporary error. Please try again in a moment — or head back home. If it keeps happening, email <a href="mailto:support@goldscalpers.com">support@goldscalpers.com</a>.</p>
    <div class="btns">
      <a href="/" class="btn btn-primary">← Back to homepage</a>
      <a href="/support" class="btn btn-ghost">Contact support</a>
    </div>
  </div>
</main>
<script src="/assets/cookie-consent.js" defer></script>
</body>
</html>
