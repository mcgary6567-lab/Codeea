<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <!-- Dark background circle for contrast on light browsers -->
  <circle cx="16" cy="16" r="15" fill="#0A0E1A"/>
  <!-- Outer scope ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="url(#g)" stroke-width="2"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="url(#g)"/>
  <!-- Crosshair lines -->
  <line x1="16" y1="2" x2="16" y2="6" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="26" x2="16" y2="30" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="16" x2="6" y2="16" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="16" x2="30" y2="16" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
